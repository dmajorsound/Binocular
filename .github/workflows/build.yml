# Builds Binocular on GitHub's own Macs and PCs: macOS VST3 + AU (Universal: Apple Silicon and Intel, ad-hoc signed),
# Windows VST3, plus installers (Mac .pkg, Windows .exe). The results are under "Actions" -> the run -> "Artifacts".
# "Run workflow" with a version (e.g. v1.0) also publishes the installers as a GitHub release.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version tag, e.g. v1.0 (empty = just build)"
        required: false
        default: ""

env:
  CLAP_JUCE_COMMIT: 3837f4a6ed2ab0ba46aba69ae5b7041c7c64ce74   # clap-juce-extensions, tested with JUCE 9.0.6
  JUCE_COMMIT: 654bdbc7a9db0dae90849b44abe91f339e9f0768   # JUCE 9.0.6, the version Binocular was tested with

jobs:
  mac:
    runs-on: macos-15-intel   # arm64 runners were often busy; Intel builds the universal binary just as well
    steps:
      - uses: actions/checkout@v4
      - name: JUCE
        run: |
          git init ../juce
          git -C ../juce remote add origin https://github.com/juce-framework/JUCE.git
          git -C ../juce fetch --depth 1 origin $JUCE_COMMIT
          git -C ../juce checkout FETCH_HEAD
      - name: CLAP extensions
        shell: bash
        run: |
          git init ../clap-juce-extensions
          git -C ../clap-juce-extensions remote add origin https://github.com/free-audio/clap-juce-extensions.git
          git -C ../clap-juce-extensions fetch --depth 1 origin $CLAP_JUCE_COMMIT
          git -C ../clap-juce-extensions checkout FETCH_HEAD
          git -C ../clap-juce-extensions submodule update --init --recursive --depth 1
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release --target Binocular_VST3 Binocular_AU Binocular_CLAP --parallel 4
      - name: Strip, sign (ad hoc) and pack
        run: |
          mkdir -p out
          cp -R build/Binocular_artefacts/Release/VST3/Binocular.vst3 out/
          cp -R build/Binocular_artefacts/Release/AU/Binocular.component out/
          cp -R build/Binocular_artefacts/Release/CLAP/Binocular.clap out/
          # remove debug symbols (smaller file, same plugin)
          strip -x out/Binocular.vst3/Contents/MacOS/Binocular
          strip -x out/Binocular.component/Contents/MacOS/Binocular
          strip -x out/Binocular.clap/Contents/MacOS/Binocular
          lipo -info out/Binocular.vst3/Contents/MacOS/Binocular
          du -sh out/Binocular.vst3 out/Binocular.component
          codesign --force --deep -s - out/Binocular.vst3
          codesign --force --deep -s - out/Binocular.component
          codesign --force --deep -s - out/Binocular.clap
          ditto -c -k --keepParent out/Binocular.vst3 Binocular_1.0.3_mac_VST3.zip
          ditto -c -k --keepParent out/Binocular.component Binocular_1.0.3_mac_AU.zip
          ditto -c -k --keepParent out/Binocular.clap Binocular_1.0.3_mac_CLAP.zip
      - name: Installer (.pkg)
        run: |
          mkdir -p ui
          # one component package per format, each fixed to its folder
          mk() {  # bundle, folder, id
            rm -rf payload && mkdir payload && cp -R "out/$1" payload/
            pkgbuild --analyze --root payload comp.plist
            plutil -replace 0.BundleIsRelocatable -bool NO comp.plist
            pkgbuild --root payload --component-plist comp.plist --install-location "/Library/Audio/Plug-Ins/$2" \
              --identifier "com.dmajorsound.binocular.$3" --version 1.0.3 "binocular-$3.pkg"
          }
          mk Binocular.vst3 VST3 vst3
          mk Binocular.component Components au
          mk Binocular.clap CLAP clap
          cp installer/mac_ui/welcome.html installer/mac_ui/logo.png installer/mac_ui/logo-dark.png ui/
          tiffutil -cathidpicheck installer/mac_ui/background.png installer/mac_ui/background@2x.png -out ui/background.tiff
          tiffutil -cathidpicheck installer/mac_ui/background-darkAqua.png installer/mac_ui/background-darkAqua@2x.png -out ui/background-darkAqua.tiff
          productbuild --distribution installer/mac_ui/distribution.xml --resources ui \
            --package-path . Binocular_1.0.3_installer_mac.pkg
          ls -la Binocular_1.0.3_installer_mac.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: Binocular_1.0.3_mac
          path: |
            Binocular_1.0.3_installer_mac.pkg
            Binocular_1.0.3_mac_VST3.zip
            Binocular_1.0.3_mac_AU.zip
            Binocular_1.0.3_mac_CLAP.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: JUCE
        shell: bash
        run: |
          git init ../juce
          git -C ../juce remote add origin https://github.com/juce-framework/JUCE.git
          git -C ../juce fetch --depth 1 origin $JUCE_COMMIT
          git -C ../juce checkout FETCH_HEAD
      - name: CLAP extensions
        shell: bash
        run: |
          git init ../clap-juce-extensions
          git -C ../clap-juce-extensions remote add origin https://github.com/free-audio/clap-juce-extensions.git
          git -C ../clap-juce-extensions fetch --depth 1 origin $CLAP_JUCE_COMMIT
          git -C ../clap-juce-extensions checkout FETCH_HEAD
          git -C ../clap-juce-extensions submodule update --init --recursive --depth 1
      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target Binocular_VST3 Binocular_CLAP --parallel 4
      - name: Installer (.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\win\binocular.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Binocular_1.0.3_windows
          path: |
            installer/win/Output/Binocular_1.0.3_installer_win64.exe
            build/Binocular_artefacts/Release/VST3/Binocular.vst3
            build/Binocular_artefacts/Release/CLAP/Binocular.clap

  # "Run workflow" with a version (e.g. v1.0) publishes the installers as a GitHub release
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release != ''
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          cat > notes.txt <<'NOTES'
          <p align="center">
          <picture>
          <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/dmajorsound/olAAF/main/installer/mac_ui/logo-dark.png">
          <img src="https://raw.githubusercontent.com/dmajorsound/olAAF/main/installer/mac_ui/logo.png" alt="dmajorsound" width="200">
          </picture>
          </p>

          <h2 align="center">Binocular – Correlation Meter</h2>
          <p align="center"><i>Mmm… coherent.</i></p>

          Free multiband correlation meter and goniometer by dmajorsound. Shows phase problems per frequency band, mono loss, time offset and polarity between left and right (or against a sidechain). The audio passes through untouched.

          ### Download
          - **Mac** (Apple Silicon and Intel): `Binocular_VERSION_installer_mac.pkg` below
          - **Windows** (64-bit): `Binocular_VERSION_installer_win64.exe` below

          ### Install
          1. Quit REAPER.
          2. Open the installer and click through. It installs VST3, CLAP and (Mac) Audio Unit into the common plug-in folders.
          3. Start REAPER. If Binocular does not show up: **Options → Preferences → Plug-ins → VST → Re-scan**.

          > [!CAUTION]
          > **Mac: "Binocular can't be opened because it is from an unidentified developer"**
          >
          > The installer is not signed by Apple. Do **not** double-click it again. Instead:
          > 1. **Right-click** (or Control-click) the .pkg and choose **Open**.
          > 2. Click **Open** in the warning.
          >
          > Still blocked? Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to Binocular.

          > [!CAUTION]
          > **Windows: "Windows protected your PC" (SmartScreen)**
          >
          > The installer is not signed by Microsoft.
          > 1. Click **More info**.
          > 2. Click **Run anyway**.
          >
          > If your browser blocks the download, choose **Keep** in the download list.

          V VERSION, developed with AI assistance · [dmajorsound.com](https://dmajorsound.com)
          NOTES
          sed -i "s/VERSION/${TAG#v}/g" notes.txt
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Binocular ${TAG#v}" \
            --notes-file notes.txt \
            dl/Binocular_1.0.3_mac/Binocular_*_installer_mac.pkg dl/Binocular_1.0.3_windows/installer/win/Output/*.exe
